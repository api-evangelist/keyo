name: Keyo
description: >-
  Keyo is a palm-based biometric identification platform offering a complete
  suite of touchless identity SaaS for payments, access control, ticketing, and
  time & attendance. Its palm-print and palm-vein (near-infrared) technology
  lets people verify their identity with a wave of the hand. Keyo exposes a REST
  API (developers.keyo.co) for managing biometric Identities and driving palm
  enrollment on Keyo devices, secured with the OAuth 2.0 client-credentials flow,
  plus real-time webhooks for enrollment and identification events. Keyo is
  backed by 500 Global and Obvious Ventures.
